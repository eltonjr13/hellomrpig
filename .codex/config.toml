# Codex configuration for the FreeCAD product engineering workflow.
# Adjust command/args if your installed FreeCAD MCP server uses a different package,
# executable, virtual environment, or local path.

model = "gpt-5.5"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[mcp_servers.freecad]
command = "uvx"
args = ["freecad-mcp"]
startup_timeout_sec = 30
tool_timeout_sec = 180
enabled = true
required = false
